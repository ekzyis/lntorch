<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>lntorch</title>
    <style>
        :root {
            --fire: #ff9b3d;
            --fire-bright: #ffd27a;
            --ember: #c2410c;
            --dark: #0a0705;
            --flame: 1; /* live brightness, driven by the flame script */
        }
        * { box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            font-family: "Courier New", monospace;
            color: var(--fire-bright);
            background: radial-gradient(circle at 50% 50%, #1a120b, var(--dark) 70%);
            overflow: hidden;
        }
        /* the torch glow, on its own layer so it can flicker in sync with the logo */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(ellipse 60% 55% at 50% 45%, rgba(255, 155, 61, 0.14), transparent 70%);
            filter: brightness(var(--flame));
        }
        .logo {
            margin: 0;
            color: var(--fire);
            font-size: clamp(9px, 2.4vw, 17px);
            line-height: 1.15;
            /* neon-sign glow: tight hot core, then progressively wider amber/ember
               bloom so the light radiates from the wordmark itself */
            text-shadow:
                0 0 2px var(--fire-bright),
                0 0 6px var(--fire),
                0 0 14px var(--fire),
                0 0 28px var(--ember),
                0 0 52px var(--ember),
                0 0 84px rgba(194, 65, 12, 0.8);
            filter: brightness(var(--flame));
        }
        .tagline {
            margin: 1.3rem 0 2.2rem;
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            color: rgba(255, 210, 122, 0.7);
            text-align: center;
        }
        .msg { margin: 0 0 0.4rem; }
        .count {
            margin: 0 0 1.5rem;
            font-size: 0.9rem;
            color: rgba(255, 210, 122, 0.6);
        }
        form { margin: 0; }
        /* neon doorway: hollow glowing tube, not a solid block. lights up as
           you approach (hover), like stepping toward a torch-lit archway */
        button {
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--fire-bright);
            background: transparent;
            border: 1px solid var(--fire);
            border-radius: 4px;
            padding: 0.75rem 1.8rem;
            cursor: pointer;
            letter-spacing: 0.12em;
            text-transform: lowercase;
            text-shadow: 0 0 4px var(--fire), 0 0 11px rgba(194, 65, 12, 0.7);
            box-shadow: 0 0 8px rgba(255, 155, 61, 0.3), inset 0 0 9px rgba(255, 155, 61, 0.12);
            /* no transition: buttons must react instantly to feel responsive */
        }
        button:hover {
            color: #fff3df;
            border-color: var(--fire-bright);
            text-shadow: 0 0 6px var(--fire-bright), 0 0 16px var(--fire), 0 0 30px var(--ember);
            box-shadow: 0 0 20px rgba(255, 155, 61, 0.6), inset 0 0 16px rgba(255, 155, 61, 0.28);
        }
        button:active { transform: translateY(1px); }
        .leave button {
            color: rgba(255, 210, 122, 0.55);
            border-color: rgba(255, 210, 122, 0.25);
            text-shadow: none;
            box-shadow: none;
            letter-spacing: 0.08em;
        }
        .leave button:hover {
            color: var(--fire-bright);
            border-color: var(--fire);
            text-shadow: 0 0 5px rgba(255, 155, 61, 0.5);
            box-shadow: 0 0 10px rgba(255, 155, 61, 0.25);
        }
        footer {
            position: fixed;
            bottom: 0.8rem;
            font-size: 0.7rem;
        }
        footer a { color: rgba(255, 210, 122, 0.4); text-decoration: none; }
        footer a:hover { color: var(--fire); }
    </style>
</head>
<body>
    <pre class="logo">
   __     __               __
  / /__  / /____  ________/ /
 / / _ \/ __/ _ \/ __/ __/ _ \
/_/_//_/\__/\___/_/  \__/_//_/
    </pre>
    <p class="tagline">Pay to keep the torch lit and win the pot.</p>
    {{if .PlayerID}}
    <p class="msg" data-testid="waiting-msg">You're in the waiting room.</p>
    <p class="count" data-testid="player-count">Players: {{.PlayerCount}}</p>
    <form class="leave" method="POST" action="/leave">
        <button type="submit" data-testid="leave-btn">Leave</button>
    </form>
    {{else}}
    <form method="POST" action="/join">
        <button type="submit" data-testid="join-btn">Enter the dungeon · {{.PlayerCount}}/10</button>
    </form>
    {{end}}
    <footer><a data-testid="commit" href="https://github.com/ekzyis/lntorch/commit/{{.Commit}}">{{.Commit}}</a></footer>
    <script>
        // Live flame: fast, irregular, never-repeating brightness. New random
        // target every 50-180ms (occasionally a deeper dip), eased toward so it
        // flickers without snapping to black.
        (function () {
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            var root = document.documentElement, cur = 1, target = 1, next = 0;
            function rand(a, b) { return a + Math.random() * (b - a); }
            function tick(t) {
                if (t >= next) {
                    target = Math.random() < 0.2 ? rand(0.5, 0.72) : rand(0.82, 1.18);
                    next = t + rand(50, 180);
                }
                cur += (target - cur) * 0.3;
                root.style.setProperty('--flame', cur.toFixed(3));
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        })();
    </script>
</body>
</html>
